name: AI CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-and-package-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Python files
        run: python -m compileall .

      - name: Run tests
        run: |
          mkdir -p test-results
          if find . -path "*/tests/test_*.py" | grep -q .; then
            pytest --junitxml=test-results/pytest.xml
          else
            echo "No tests found." > test-results/README.txt
          fi

      - name: Upload AI test results
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload AI docs and integration contracts
        uses: actions/upload-artifact@v4
        with:
          name: ai-docs-and-contracts
          path: |
            docs/**
            integration_contracts/**
          if-no-files-found: warn
